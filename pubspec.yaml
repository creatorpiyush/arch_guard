name: arch_guard
description: A CLI tool and Dart library for static architecture analysis, Clean Architecture layer governance, circular dependency metrics, and graph visualization.
repository: https://github.com/creatorpiyush/arch_guard
version: 1.2.0
topics:
  - clean-architecture
  - static-analysis
  - developer-tools
  - dependency-graph
  - architecture-governance

environment:
  sdk: ^3.11.0

executables:
  arch_guard: arch_guard

dependencies:
  args: ^2.7.0
  glob: ^2.1.3
  path: ^1.9.1
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.12

