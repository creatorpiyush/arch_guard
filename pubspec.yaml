name: dep_graph_visualizer
description: A CLI tool and Dart library to scan projects, detect circular dependencies using Tarjan's algorithm, and export visual graphs.
repository: https://github.com/creatorpiyush/dep_graph_visualizer
version: 1.1.2
topics:
  - cli
  - static-analysis
  - developer-tools
  - dependency-graph

environment:
  sdk: ^3.11.0

executables:
  dep_graph_visualizer: dep_graph_visualizer

dependencies:
  args: ^2.7.0
  glob: ^2.1.3
  path: ^1.9.1
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.12

