name: Feature request
description: Suggest a new check, preset, output format or option.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, for example the architecture or CI setup you use.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like arch_guard to do?
      description: Config, command or output you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other tools you have tried.
