name: Verify & PR Checks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Format, Lint & Publish Dry-Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Check code formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run static analysis
        run: dart analyze --fatal-infos

      - name: Validate pub package (dry-run)
        run: dart pub publish --dry-run

  test:
    name: Test (${{ matrix.os }}, Dart ${{ matrix.sdk }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        # Keep the first entry in sync with the lower bound of `environment.sdk` in pubspec.yaml.
        sdk: [ 3.8.0, stable ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Install dependencies
        run: dart pub get

      - name: Run unit tests
        run: dart test

  action:
    name: GitHub Action self-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # The sample project has known cycles, so a passing run proves the
      # baseline/args plumbing, and the reports must exist afterwards.
      - name: Run action from this checkout
        id: arch_guard
        uses: ./
        with:
          path: example/sample_project
          version: source
          args: --no-fail-on-cycle
          comment: ${{ matrix.os == 'ubuntu-latest' }}

      - name: Check action outputs
        shell: bash
        env:
          EXIT_CODE: ${{ steps.arch_guard.outputs.exit-code }}
          SARIF: ${{ steps.arch_guard.outputs.sarif-file }}
          MARKDOWN: ${{ steps.arch_guard.outputs.markdown-file }}
        run: |
          test "$EXIT_CODE" = "0"
          test -f "$SARIF"
          grep -q '"version": "2.1.0"' "$SARIF"
          grep -q 'arch_guard-report' "$MARKDOWN"
