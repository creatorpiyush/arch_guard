name: Verify & PR Checks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Format, Lint & Publish Dry-Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Check code formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run static analysis
        run: dart analyze --fatal-infos

      - name: Validate pub package (dry-run)
        run: dart pub publish --dry-run

  test:
    name: Test (${{ matrix.os }}, Dart ${{ matrix.sdk }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        # Keep the first entry in sync with the lower bound of `environment.sdk` in pubspec.yaml.
        sdk: [ 3.8.0, stable ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Install dependencies
        run: dart pub get

      - name: Run unit tests
        run: dart test
