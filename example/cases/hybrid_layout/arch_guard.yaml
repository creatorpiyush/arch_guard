# arch_guard.yaml, generated by `arch_guard init`.
# Layout: found domain/, data/, presentation/, application/ folders and a Riverpod dependency, plus bloc/ folders.
# Reference: https://github.com/creatorpiyush/arch_guard#configuration-arch_guardyaml-or-pubspecyaml

# presentation, application, domain and data layers as in the Riverpod app architecture; domain depends on nothing, data never sees the UI.
preset: riverpod

# The preset expands to the layers below. To change a layer,
# list it under `layers:` with just the keys to change (e.g.
# `allowed_imports`); new layer names are added.
#
# layers:
#   domain:
#     patterns: ["lib/**/domain/**"]
#     allowed_imports: [domain]
#   data:
#     patterns: ["lib/**/data/**"]
#     allowed_imports: [data, domain]
#   application:
#     patterns: ["lib/**/application/**"]
#     allowed_imports: [application, domain, data]
#   presentation:
#     patterns: ["lib/**/presentation/**"]
#     allowed_imports: [presentation, application, domain, data]

# Bloc/cubit folders sit next to the preset's layers, so they
# get their own `bloc` layer: it may import what the UI may,
# and the UI may use it. Blocs inside a presentation/ folder
# still count as `presentation` (the first matching layer wins).
layers:
  bloc:
    patterns: ["lib/**/bloc/**"]
    allowed_imports: [bloc, application, domain, data]
  presentation:
    allowed_imports: [presentation, application, domain, data, bloc]

ignore:
  - "**/*.g.dart"
  - "**/*.freezed.dart"
  - "**/*.mocks.dart"
  - "**/*.gr.dart"
  - "**/*.config.dart"

fail_on_layer_violation: true

# Fail when a circular-dependency group grows beyond N files:
# max_scc_size: 10
