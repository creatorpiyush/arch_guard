name: arch_guard_lint
description: Analyzer plugin that shows arch_guard layer violations, forbidden package imports and circular dependencies as warnings in your IDE and in dart analyze, with quick fixes.
version: 0.2.0
repository: https://github.com/creatorpiyush/arch_guard/tree/main/arch_guard_lint
issue_tracker: https://github.com/creatorpiyush/arch_guard/issues
documentation: https://creatorpiyush.github.io/arch_guard/ide.html
topics:
  - clean-architecture
  - static-analysis
  - lints

environment:
  sdk: ^3.10.0

dependencies:
  analysis_server_plugin: ^0.3.3
  analyzer: ">=8.4.0 <15.0.0"
  analyzer_plugin: ">=0.13.10 <0.15.0"
  arch_guard: ^1.8.0
  glob: ^2.1.3
  path: ^1.9.1
  yaml: ^3.1.0
  yaml_edit: ^2.2.0

dev_dependencies:
  analyzer_testing: ">=0.1.7 <0.5.0"
  lints: ^6.1.0
  test: ^1.25.12
  test_reflective_loader: ">=0.2.3 <0.7.0"
